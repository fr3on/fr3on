name: Update profile

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rewrite the generated README blocks
        run: python3 .github/scripts/update_profile.py
        env:
          GITHUB_TOKEN: ${{ secrets.LANGUAGES_TOKEN || secrets.GITHUB_TOKEN }}
          LANGUAGES_TOKEN: ${{ secrets.LANGUAGES_TOKEN }}
          OWNER: ${{ github.repository_owner }}
      - name: Commit if changed
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Update profile"
          git push
